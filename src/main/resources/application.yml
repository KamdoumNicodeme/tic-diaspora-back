server:
  port: ${PORT:8080}

spring:
  application:
    name: tic-diaspora
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tic_diaspora}
    username: ${DB_USERNAME:tic}
    password: ${DB_PASSWORD:tic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.netlify.app}
  security:
    issuer: tic-diaspora
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    token-validity-minutes: ${JWT_VALIDITY_MINUTES:720}
  uploads:
    contribution-proofs-dir: ${CONTRIBUTION_PROOFS_DIR:./uploads/contribution-proofs}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@ticdiaspora.org}
  reminders:
    meeting-48h-cron: "${MEETING_REMINDER_48H_CRON:0 */30 * * * *}"
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    president-email: ${BOOTSTRAP_PRESIDENT_EMAIL:president@ticdiaspora.org}
    president-password: ${BOOTSTRAP_PRESIDENT_PASSWORD:President123!}
    member-email: ${BOOTSTRAP_MEMBER_EMAIL:membre@ticdiaspora.org}
    member-password: ${BOOTSTRAP_MEMBER_PASSWORD:Member123!}

logging:
  level:
    com.ticdiaspora: INFO
