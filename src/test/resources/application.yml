spring:
  datasource:
    url: jdbc:h2:mem:ticdiaspora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  bootstrap:
    enabled: false
  security:
    issuer: tic-diaspora-test
    jwt-secret: test-secret-test-secret-test-secret-32b
    token-validity-minutes: 60
