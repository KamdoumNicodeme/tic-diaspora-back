spring:
  datasource:
    url: jdbc:h2:mem:ticdiaspora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: localhost
    port: 1025
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  mail:
    enabled: false
    from: no-reply@ticdiaspora.test
  reminders:
    meeting-48h-cron: "0 */30 * * * *"
  uploads:
    contribution-proofs-dir: ${CONTRIBUTION_PROOFS_DIR:./uploads/contribution-proofs}
  bootstrap:
    enabled: true
  security:
    issuer: tic-diaspora-test
    jwt-secret: test-secret-test-secret-test-secret-32b
    token-validity-minutes: 720
